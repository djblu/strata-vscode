name: Build prebuilt runtimes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: node scripts/build-runtime.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ runner.os }}-${{ runner.arch }}
          path: dist/runtime/*
          compression-level: 0
          retention-days: 7
